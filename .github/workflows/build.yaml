name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mcps: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One filter per MCP; shared build files rebuild all of them
      - name: Detect changed MCPs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            akeyless: [akeyless/**, go.mod, go.sum, Dockerfile, .github/workflows/build.yaml]
            pushover: [pushover/**, go.mod, go.sum, Dockerfile, .github/workflows/build.yaml]

  build:
    needs: changes
    if: needs.changes.outputs.mcps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mcp: ${{ fromJSON(needs.changes.outputs.mcps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./${{ matrix.mcp }}/...

      # Commit time in UTC, so tags sort in order and a rerun reuses the same tag
      - name: Release tag
        id: tag
        run: echo "tag=$(TZ=UTC git log -1 --format=%cd --date=format-local:v%Y.%m.%d.%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: MCP=${{ matrix.mcp }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:latest
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:${{ steps.tag.outputs.tag }}
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.mcp }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mcp }}
