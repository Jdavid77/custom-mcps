name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mcps: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One filter per MCP; shared build files rebuild all of them
      - name: Detect changed MCPs
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            akeyless: [akeyless/**, go.mod, go.sum, Dockerfile]
            pushover: [pushover/**, go.mod, go.sum, Dockerfile]

  build:
    needs: changes
    if: needs.changes.outputs.mcps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mcp: ${{ fromJSON(needs.changes.outputs.mcps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: ./${{ matrix.mcp }}/...

      # The image's own tags hold the counter, so each MCP counts separately and no git tags are needed
      - name: Latest image tag
        id: latest
        env:
          IMAGE: jdavid77/${{ matrix.mcp }}-mcp
        run: |
          token=$(curl -s "https://ghcr.io/token?scope=repository:$IMAGE:pull" | jq -r .token)
          tag=$(curl -s -H "Authorization: Bearer $token" "https://ghcr.io/v2/$IMAGE/tags/list?n=1000" \
            | jq -r '.tags[]?' | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$' | sort -V | tail -1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate release tag
        id: release
        uses: amitsingh-007/next-release-tag@4c9de5e054a72cd4c2cb1db76d561cd19e2ea69a # v6.7.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: 'v'
          tag_template: 'yyyy.mm.dd.i'
          previous_tag: ${{ steps.latest.outputs.tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: MCP=${{ matrix.mcp }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:latest
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:${{ steps.release.outputs.next_release_tag }}
          cache-from: type=gha,scope=${{ matrix.mcp }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mcp }}
