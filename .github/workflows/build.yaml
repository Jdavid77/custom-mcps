name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mcp: [akeyless, pushover]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./${{ matrix.mcp }}/...
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MCP=${{ matrix.mcp }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:latest
            ghcr.io/jdavid77/${{ matrix.mcp }}-mcp:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.mcp }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mcp }}
